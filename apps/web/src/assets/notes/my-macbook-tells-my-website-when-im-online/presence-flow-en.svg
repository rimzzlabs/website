<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" rx="24" fill="#1C1917"/>
  <text x="40" y="58" font-size="26" font-weight="700" fill="#FAFAF9">How the green dot gets onto the page</text>
  
  <rect x="40" y="110" width="240" height="92" rx="14" fill="#292524" stroke="#FFDD00" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#FAFAF9">MacBook</text>
  <text x="160" y="180" text-anchor="middle" font-size="17" fill="#D6D3D1">Raycast menu bar</text>
  
  <line x1="280" y1="156" x2="368" y2="156" stroke="#FFDD00" stroke-width="3"/>
  <path d="M366 148 L380 156 L366 164 Z" fill="#FFDD00"/>
  
  <text x="160" y="228" text-anchor="middle" font-size="15" fill="#FFDD00">on · off · ping every 2 min</text>
  
  <rect x="380" y="110" width="240" height="92" rx="14" fill="#292524" stroke="#FFDD00" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#FAFAF9">POST /api/presence</text>
  <text x="500" y="180" text-anchor="middle" font-size="17" fill="#D6D3D1">Pages Function</text>
  
  <line x1="620" y1="156" x2="708" y2="156" stroke="#FFDD00" stroke-width="3"/>
  <path d="M706 148 L720 156 L706 164 Z" fill="#FFDD00"/>
  <text x="670" y="142" text-anchor="middle" font-size="15" fill="#FFDD00">Bearer token</text>
  
  <rect x="720" y="110" width="240" height="92" rx="14" fill="#292524" stroke="#FAFAF9" stroke-width="2"/>
  <text x="840" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#FAFAF9">D1: one row</text>
  <text x="840" y="180" text-anchor="middle" font-size="17" fill="#D6D3D1">enabled · last_seen_at</text>
  
  <rect x="40" y="290" width="240" height="92" rx="14" fill="#292524" stroke="#38BDF8" stroke-width="2"/>
  <text x="160" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#FAFAF9">Visitor or crawler</text>
  <text x="160" y="360" text-anchor="middle" font-size="17" fill="#D6D3D1">GET any page</text>
  
  <line x1="280" y1="336" x2="368" y2="336" stroke="#38BDF8" stroke-width="3"/>
  <path d="M366 328 L380 336 L366 344 Z" fill="#38BDF8"/>
  
  
  <rect x="380" y="290" width="240" height="92" rx="14" fill="#292524" stroke="#38BDF8" stroke-width="2"/>
  <text x="500" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#FAFAF9">Middleware</text>
  <text x="500" y="360" text-anchor="middle" font-size="17" fill="#D6D3D1">HTMLRewriter</text>
  <line x1="840" y1="202" x2="840" y2="250" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="840" y1="250" x2="500" y2="250" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="500" y1="250" x2="500" y2="276" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M492 276 L500 290 L508 276 Z" fill="#38BDF8"/>
  <text x="680" y="242" text-anchor="middle" font-size="15" fill="#38BDF8">reads the row, cached 30 s</text>
  
  <line x1="620" y1="336" x2="708" y2="336" stroke="#38BDF8" stroke-width="3"/>
  <path d="M706 328 L720 336 L706 344 Z" fill="#38BDF8"/>
  
  
  <rect x="720" y="290" width="240" height="92" rx="14" fill="#292524" stroke="#38BDF8" stroke-width="2"/>
  <text x="840" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#FAFAF9">Static HTML</text>
  <text x="840" y="360" text-anchor="middle" font-size="17" fill="#D6D3D1">with the status inside</text>
  <text x="840" y="408" text-anchor="middle" font-size="15" fill="#D6D3D1">“Online” or “Last active 3 hours ago”</text>
  <text x="40" y="440" font-size="16" fill="#A8A29E">Online = toggle on and last ping under 5 min old</text>
</svg>