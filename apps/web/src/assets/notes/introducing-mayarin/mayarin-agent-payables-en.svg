<svg
	viewBox="0 0 800 440"
	xmlns="http://www.w3.org/2000/svg"
	role="img"
	aria-label="How an AI agent pays an invoice or a payment link. First it finds what merchants chose to list. Then it asks for a 402, which quotes the full balance and holds the price for about sixty seconds. Then it signs. If it signs in time, the payment settles and the merchant is credited. If it signs too late, it gets a 410 and asks for a new quote. If another agent paid first, it gets a 409 and is refused."
>
	<defs>
		<marker id="pay-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0 0 L10 5 L0 10 z" fill="#38BDF8" />
		</marker>
	</defs>

	<rect width="800" height="440" rx="16" fill="#1C1917" />

	<g font-family="system-ui, sans-serif" font-size="11" fill="#78716C" letter-spacing="1">
		<text x="30" y="42">1. FIND</text>
		<text x="290" y="42">2. GET A QUOTE</text>
		<text x="550" y="42">3. SIGN</text>
	</g>

	<!-- top row -->
	<g fill="#292524" stroke="#38BDF8" stroke-width="1.5">
		<rect x="30" y="58" width="220" height="110" rx="10" />
		<rect x="290" y="58" width="220" height="110" rx="10" />
		<rect x="550" y="58" width="220" height="110" rx="10" />
	</g>
	<g font-family="system-ui, sans-serif">
		<g font-size="14" font-weight="600" fill="#E7E5E4">
			<text x="48" y="90">Browse the payables</text>
			<text x="308" y="90">Ask for a 402</text>
			<text x="568" y="90">Sign one authorization</text>
		</g>
		<g font-size="12" fill="#A8A29E">
			<text x="48" y="114">invoices and payment links</text>
			<text x="48" y="131">merchants chose to list,</text>
			<text x="48" y="148">no merchant id needed</text>
			<text x="308" y="114">it quotes the full balance,</text>
			<text x="308" y="131">and holds that price for</text>
			<text x="308" y="148">about 60 seconds</text>
			<text x="568" y="114">for exactly the quoted</text>
			<text x="568" y="131">amount, never part of it</text>
		</g>
	</g>
	<g stroke="#38BDF8" stroke-width="2" marker-end="url(#pay-blue)">
		<line x1="252" y1="113" x2="286" y2="113" />
		<line x1="512" y1="113" x2="546" y2="113" />
	</g>

	<!-- branches -->
	<g stroke="#44403C" stroke-width="2" fill="none">
		<path d="M660 170 V200 H140 V246" />
		<path d="M400 200 V246" />
		<path d="M660 200 V246" />
	</g>

	<!-- outcomes -->
	<rect x="30" y="248" width="220" height="110" rx="10" fill="#292524" stroke="#FFDD00" stroke-width="2" />
	<g fill="#292524" stroke="#44403C" stroke-width="1.5">
		<rect x="290" y="248" width="220" height="110" rx="10" />
		<rect x="550" y="248" width="220" height="110" rx="10" />
	</g>
	<g font-family="system-ui, sans-serif">
		<text x="48" y="280" font-size="14" font-weight="600" fill="#FFDD00">Signed in time</text>
		<g font-size="14" font-weight="600" fill="#E7E5E4">
			<text x="308" y="280">Signed too late: 410</text>
			<text x="568" y="280">Someone paid first: 409</text>
		</g>
		<g font-size="12" fill="#A8A29E">
			<text x="48" y="304">the payment settles, and</text>
			<text x="48" y="321">the merchant is credited</text>
			<text x="48" y="338">in their own asset</text>
			<text x="308" y="304">the quote expired, so the</text>
			<text x="308" y="321">agent asks for a new 402</text>
			<text x="308" y="338">at the same URL</text>
			<text x="568" y="304">the first signature to</text>
			<text x="568" y="321">settle wins, so nothing</text>
			<text x="568" y="338">is ever paid twice</text>
		</g>
	</g>

	<text x="400" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#A8A29E">
		The same invoices and links a person pays through the checkout, paid by an agent over x402.
	</text>
</svg>
