<svg
	viewBox="0 0 800 460"
	xmlns="http://www.w3.org/2000/svg"
	role="img"
	aria-label="Pembayar datang dengan wallet, transfer biasa, metode pembayaran lokal, atau AI agent. Mayarin mengunci kurs, menukar aset, mengonfirmasi on-chain, dan mencatat di ledger. Merchant menerima USDC atau USDT di wallet miliknya sendiri."
>
	<defs>
		<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0 0 L10 5 L0 10 z" fill="#38BDF8" />
		</marker>
		<marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0 0 L10 5 L0 10 z" fill="#FFDD00" />
		</marker>
	</defs>

	<rect width="800" height="460" rx="16" fill="#1C1917" />

	<!-- column labels -->
	<g font-family="system-ui, sans-serif" font-size="11" fill="#78716C" letter-spacing="1">
		<text x="40" y="42">CARA PELANGGAN BAYAR</text>
		<text x="320" y="42">MAYARIN</text>
		<text x="590" y="42">YANG DITERIMA MERCHANT</text>
	</g>

	<!-- payer boxes -->
	<g fill="#292524" stroke="#44403C" stroke-width="1.5">
		<rect x="40" y="60" width="210" height="70" rx="10" />
		<rect x="40" y="148" width="210" height="70" rx="10" />
		<rect x="40" y="236" width="210" height="70" rx="10" />
		<rect x="40" y="324" width="210" height="70" rx="10" />
	</g>
	<g font-family="system-ui, sans-serif">
		<g font-size="14" font-weight="600" fill="#E7E5E4">
			<text x="58" y="90">Wallet crypto</text>
			<text x="58" y="178">Transfer biasa</text>
			<text x="58" y="266">Transfer bank &amp; e-wallet</text>
			<text x="58" y="354">AI agent</text>
		</g>
		<g font-size="12" fill="#A8A29E">
			<text x="58" y="112">ETH atau stablecoin</text>
			<text x="58" y="200">dari exchange atau scan QR</text>
			<text x="58" y="288">dalam mata uang lokal</text>
			<text x="58" y="376">bayar otomatis lewat x402</text>
		</g>
	</g>

	<!-- arrows into Mayarin -->
	<g stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)">
		<line x1="252" y1="95" x2="316" y2="160" />
		<line x1="252" y1="183" x2="316" y2="205" />
		<line x1="252" y1="271" x2="316" y2="250" />
		<line x1="252" y1="359" x2="316" y2="295" />
	</g>

	<!-- Mayarin box -->
	<rect x="320" y="60" width="200" height="334" rx="12" fill="#292524" stroke="#FFDD00" stroke-width="2" />
	<g font-family="system-ui, sans-serif">
		<text x="340" y="92" font-size="16" font-weight="700" fill="#FFDD00">Mayarin</text>
		<text x="340" y="114" font-size="12" fill="#A8A29E">cukup satu integrasi</text>
		<g font-size="13" fill="#E7E5E4">
			<text x="340" y="160">1. Kunci kurs</text>
			<text x="340" y="205">2. Konversi aset</text>
			<text x="340" y="250">3. Cek di blockchain</text>
			<text x="340" y="295">4. Catat transaksi</text>
		</g>
		<text x="340" y="370" font-size="11" fill="#78716C">harga tetap dalam IDR, SGD...</text>
	</g>

	<!-- arrow to merchant -->
	<line x1="522" y1="227" x2="576" y2="227" stroke="#FFDD00" stroke-width="2.5" marker-end="url(#arrow-yellow)" />

	<!-- merchant box -->
	<rect x="580" y="167" width="190" height="120" rx="10" fill="#292524" stroke="#44403C" stroke-width="1.5" />
	<g font-family="system-ui, sans-serif">
		<text x="598" y="200" font-size="14" font-weight="600" fill="#E7E5E4">Masuk ke wallet kamu</text>
		<text x="598" y="230" font-size="18" font-weight="700" fill="#FFDD00">USDC atau USDT</text>
		<text x="598" y="260" font-size="12" fill="#A8A29E">nominalnya pas sesuai</text>
		<text x="598" y="276" font-size="12" fill="#A8A29E">harga yang kamu pasang</text>
	</g>

	<text x="400" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#A8A29E">
		Pelanggan bayar dengan yang mereka punya, kamu terima sesuai harga yang kamu pasang.
	</text>
</svg>
