<svg
	viewBox="0 0 800 420"
	xmlns="http://www.w3.org/2000/svg"
	role="img"
	aria-label="Three ways to fund a Mayarin payment. A person with a wallet pays through the PaymentRouter contract. Anyone with a plain transfer pays to a per-payment deposit address. A program or AI agent pays with a signed x402 authorization. All three share one payment intent, one status model, and one ledger."
>
	<defs>
		<marker id="paths-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
			<path d="M0 0 L10 5 L0 10 z" fill="#38BDF8" />
		</marker>
	</defs>

	<rect width="800" height="420" rx="16" fill="#1C1917" />

	<g font-family="system-ui, sans-serif" font-size="11" fill="#78716C" letter-spacing="1">
		<text x="30" y="42">WHO PAYS</text>
		<text x="270" y="42">HOW IT IS FUNDED</text>
		<text x="590" y="42">WHAT STAYS THE SAME</text>
	</g>

	<!-- payer boxes -->
	<g fill="#292524" stroke="#44403C" stroke-width="1.5">
		<rect x="30" y="60" width="200" height="90" rx="10" />
		<rect x="30" y="168" width="200" height="90" rx="10" />
		<rect x="30" y="276" width="200" height="90" rx="10" />
	</g>
	<g font-family="system-ui, sans-serif">
		<g font-size="14" font-weight="600" fill="#E7E5E4">
			<text x="48" y="98">A person with a wallet</text>
			<text x="48" y="206">Anyone with a transfer</text>
			<text x="48" y="314">A program or AI agent</text>
		</g>
		<g font-size="12" fill="#A8A29E">
			<text x="48" y="120">connects and signs once</text>
			<text x="48" y="228">exchange withdrawal, QR scan</text>
			<text x="48" y="336">pays per request</text>
		</g>
	</g>

	<!-- arrows -->
	<g stroke="#38BDF8" stroke-width="2" marker-end="url(#paths-arrow)">
		<line x1="232" y1="105" x2="266" y2="105" />
		<line x1="232" y1="213" x2="266" y2="213" />
		<line x1="232" y1="321" x2="266" y2="321" />
	</g>

	<!-- mechanism boxes -->
	<g fill="#292524" stroke="#38BDF8" stroke-width="1.5">
		<rect x="270" y="60" width="270" height="90" rx="10" />
		<rect x="270" y="168" width="270" height="90" rx="10" />
		<rect x="270" y="276" width="270" height="90" rx="10" />
	</g>
	<g font-family="system-ui, sans-serif">
		<g font-size="14" font-weight="600" fill="#E7E5E4">
			<text x="288" y="92">PaymentRouter contract</text>
			<text x="288" y="200">Per-payment deposit address</text>
			<text x="288" y="308">x402 signed authorization</text>
		</g>
		<g font-size="12" fill="#A8A29E">
			<text x="288" y="114">receives, swaps, and settles</text>
			<text x="288" y="131">in one transaction</text>
			<text x="288" y="222">Mayarin watches the chain</text>
			<text x="288" y="239">and matches the deposit</text>
			<text x="288" y="330">a facilitator broadcasts it, and</text>
			<text x="288" y="347">Mayarin checks it on-chain</text>
		</g>
	</g>

	<!-- connectors to the shared box -->
	<g stroke="#44403C" stroke-width="2" fill="none">
		<path d="M542 105 H566 V213 H586" />
		<path d="M542 213 H586" />
		<path d="M542 321 H566 V213" />
	</g>

	<!-- shared box -->
	<rect x="590" y="60" width="180" height="306" rx="12" fill="#292524" stroke="#FFDD00" stroke-width="2" />
	<g font-family="system-ui, sans-serif">
		<g font-size="14" font-weight="600" fill="#FFDD00">
			<text x="608" y="160">One payment intent</text>
			<text x="608" y="216">One status model</text>
			<text x="608" y="272">One ledger</text>
		</g>
	</g>

	<text x="400" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#A8A29E">
		The hosted checkout picks the path that fits the payer.
	</text>
</svg>
