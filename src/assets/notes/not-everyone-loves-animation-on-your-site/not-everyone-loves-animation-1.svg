<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spektrum animasi: dari menjawab pertanyaan sampai minta perhatian">
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFDD00"/>
      <stop offset="1" stop-color="#57534E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="#1C1917"/>

  <text x="60" y="80" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#FFDD00">MENJAWAB PERTANYAAN</text>
  <text x="740" y="80" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#A8A29E">MINTA PERHATIAN</text>

  <rect x="60" y="110" width="680" height="10" rx="5" fill="url(#spectrum)"/>
  <line x1="400" y1="104" x2="400" y2="126" stroke="#44403C" stroke-width="2"/>

  <!-- chips kiri: animasi yang bekerja -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#E7E5E4">
    <rect x="60" y="156" width="126" height="32" rx="16" fill="none" stroke="#44403C"/>
    <circle cx="76" cy="172" r="3.5" fill="#FFDD00"/>
    <text x="88" y="177">splash screen</text>

    <rect x="196" y="156" width="92" height="32" rx="16" fill="none" stroke="#44403C"/>
    <circle cx="212" cy="172" r="3.5" fill="#FFDD00"/>
    <text x="224" y="177">skeleton</text>

    <rect x="60" y="198" width="144" height="32" rx="16" fill="none" stroke="#44403C"/>
    <circle cx="76" cy="214" r="3.5" fill="#FFDD00"/>
    <text x="88" y="219">feedback tombol</text>

    <rect x="214" y="198" width="70" height="32" rx="16" fill="none" stroke="#44403C"/>
    <circle cx="230" cy="214" r="3.5" fill="#FFDD00"/>
    <text x="242" y="219">toast</text>
  </g>

  <!-- chips kanan: animasi yang minta perhatian -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A8A29E">
    <rect x="492" y="156" width="90" height="32" rx="16" fill="none" stroke="#44403C" stroke-dasharray="5 4"/>
    <circle cx="508" cy="172" r="3.5" fill="#78716C"/>
    <text x="520" y="177">parallax</text>

    <rect x="592" y="156" width="148" height="32" rx="16" fill="none" stroke="#44403C" stroke-dasharray="5 4"/>
    <circle cx="608" cy="172" r="3.5" fill="#78716C"/>
    <text x="620" y="177">elemen melayang</text>

    <rect x="556" y="198" width="184" height="32" rx="16" fill="none" stroke="#44403C" stroke-dasharray="5 4"/>
    <circle cx="572" cy="214" r="3.5" fill="#78716C"/>
    <text x="584" y="219">koreografi checkout</text>
  </g>

  <text x="60" y="282" font-family="system-ui, sans-serif" font-size="13" fill="#78716C">Semakin ke kanan, semakin sedikit pertanyaan pengguna yang dijawab.</text>
</svg>
