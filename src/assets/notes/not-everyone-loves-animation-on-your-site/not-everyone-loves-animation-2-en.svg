<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="User intent rises from browsing to checkout while tolerance for decorative animation falls">
  <rect width="800" height="420" rx="16" fill="#1C1917"/>

  <!-- recessive grid -->
  <g stroke="#292524" stroke-width="1">
    <line x1="100" y1="120" x2="720" y2="120"/>
    <line x1="100" y1="225" x2="720" y2="225"/>
  </g>
  <line x1="100" y1="330" x2="720" y2="330" stroke="#44403C" stroke-width="1.5"/>

  <text x="92" y="115" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#78716C">high</text>
  <text x="92" y="330" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#78716C">low</text>

  <!-- tolerance for decorative animation: falling -->
  <path d="M140 150 Q400 200 660 300" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <!-- user intent: rising -->
  <path d="M140 280 Q400 230 660 110" fill="none" stroke="#FFDD00" stroke-width="3"/>

  <g stroke="#1C1917" stroke-width="2.5">
    <circle cx="140" cy="150" r="6" fill="#38BDF8"/>
    <circle cx="660" cy="300" r="6" fill="#38BDF8"/>
    <circle cx="140" cy="280" r="6" fill="#FFDD00"/>
    <circle cx="660" cy="110" r="6" fill="#FFDD00"/>
  </g>

  <!-- direct labels, ink text + line swatch -->
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E7E5E4">
    <line x1="558" y1="82" x2="582" y2="82" stroke="#FFDD00" stroke-width="3"/>
    <text x="590" y="87">User intent</text>

    <line x1="392" y1="322" x2="416" y2="322" stroke="#38BDF8" stroke-width="3"/>
    <text x="424" y="327">Tolerance for decorative animation</text>
  </g>

  <!-- stages -->
  <g stroke="#44403C" stroke-width="1.5">
    <line x1="140" y1="330" x2="140" y2="338"/>
    <line x1="400" y1="330" x2="400" y2="338"/>
    <line x1="660" y1="330" x2="660" y2="338"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A8A29E" text-anchor="middle">
    <text x="140" y="362">Browsing</text>
    <text x="400" y="362">Comparing</text>
    <text x="660" y="362">Checkout</text>
  </g>
</svg>
